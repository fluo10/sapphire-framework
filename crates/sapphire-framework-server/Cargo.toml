[package]
name = "sapphire-framework-server"
version.workspace = true
edition.workspace = true
description = "App server skeleton for sapphire-framework: owns a workspace's cache and serves it over IPC"
license.workspace = true
repository.workspace = true
keywords = ["server", "ipc", "local-first", "workspace"]
categories = ["asynchronous"]

[features]
default = ["redb-store"]
redb-store = ["sapphire-backend/redb-store"]
# Builds the test-only app server binary used by the integration tests, and the
# `sync::testing::StubBridge` a caller without a real bridge can drive the runtime with.
test-util = []

[[bin]]
name = "server-test-app"
path = "src/bin/server-test-app.rs"
required-features = ["test-util"]

[dependencies]
sapphire-backend = { package = "sapphire-framework-backend", version = "0.14.0", path = "../sapphire-framework-backend", default-features = false }
sapphire-bridge-api = { package = "sapphire-framework-bridge-api", version = "0.14.0", path = "../sapphire-framework-bridge-api" }
sapphire-framework-session = { version = "0.14.0", path = "../sapphire-framework-session" }
sapphire-ipc = { package = "sapphire-framework-ipc", version = "0.14.0", path = "../sapphire-framework-ipc" }
sapphire-sync = { package = "sapphire-framework-sync", version = "0.14.0", path = "../sapphire-framework-sync" }
sapphire-workspace = { package = "sapphire-framework-workspace", version = "0.14.0", path = "../sapphire-framework-workspace", default-features = false }
clap.workspace = true
grain-id.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net"] }
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Default features turn the redb store on (`first_pins_the_problem` needs a real
# exclusive file lock to pin), while the lib dependency above keeps the server
# itself store-agnostic.
sapphire-backend = { package = "sapphire-framework-backend", version = "0.14.0", path = "../sapphire-framework-backend" }
sapphire-framework-server = { path = ".", features = ["test-util"] }
tempfile = "3"
toml.workspace = true
# The privilege tests fork and call `geteuid` / `waitpid` directly, so `libc` has to be
# reachable from the integration test. The `[target.'cfg(unix)'.dependencies]` entry above
# already is — a normal dependency reaches every target, tests included — and this crate's
# test suite was verified to compile with this section removed. It stays because it is where
# a reader looks for a test target's dependencies, and because it keeps the tests honest if
# the library's own libc use ever moves behind a cfg the tests do not share.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"