[package]
name = "sapphire-framework-backend"
version.workspace = true
edition.workspace = true
description = "Async GUI-facing backend trait (local + remote) over a sapphire-framework workspace"
license.workspace = true
repository.workspace = true
keywords = ["backend", "async", "gui", "workspace"]
categories = ["asynchronous"]

[features]
default = ["redb-store"]
redb-store = ["sapphire-workspace/redb-store"]

[dependencies]
sapphire-workspace = { package = "sapphire-framework-workspace", version = "0.14.0", path = "../sapphire-framework-workspace", default-features = false }
sapphire-remote-client = { package = "sapphire-framework-remote-client", version = "0.14.0", path = "../sapphire-framework-remote-client" }
sapphire-ipc = { package = "sapphire-framework-ipc", version = "0.14.0", path = "../sapphire-framework-ipc" }
sapphire-rpc = { package = "sapphire-framework-rpc", version = "0.14.0", path = "../sapphire-framework-rpc" }
tokio = { workspace = true, features = ["rt", "sync", "macros"] }
async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono = { workspace = true }
serde = { workspace = true }
serde_json.workspace = true
indexmap = { workspace = true }
grain-id.workspace = true

[dev-dependencies]
sapphire-remote-server = { package = "sapphire-framework-remote-server", version = "0.14.0", path = "../sapphire-framework-remote-server" }
sapphire-framework-server = { version = "0.14.0", path = "../sapphire-framework-server", features = ["test-util"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }
axum.workspace = true
tempfile = "3"
toml.workspace = true
serde_json.workspace = true

[lib]
name = "sapphire_backend"
