[workspace]
# 公開クレートはすべて統一バージョン（workspace.package.version）で運用する。
# 既存タグ運用に合わせて、ワークスペース全体で 1 つの `v{version}` タグと
# GitHub release だけを作る。crates.io publish は各クレート個別に行う。
#
# ── リリース再開（2026-09） ───────────────────────────────────────────────
# 移行が一段落し、アプリ側（agent / journal）が git 依存をやめて crates.io を
# 参照できるようにするため、publish を再開する。ファサード
# `sapphire-framework` を公開するには、feature 越しの optional 依存も含めて
# path 依存の全クレートが crates.io に存在している必要がある（cargo は
# optional でも publish 済みであることを要求する）。よって
# `sapphire-framework-gui` も含め、ワークスペースの全クレートを公開対象に
# 戻し、個別の `release = false` は撤廃する。
#
# 全クレートが version_group = "framework" に属するため、bump は常に足並みを
# そろえる。中身が変わっていないクレートも一緒に再 publish されるが、これは
# ロックステップ運用の想定内（bevy と同じ）で、利用者側は requirement と
# lockfile が支配するので影響を受けない。
changelog_update = true
dependencies_update = true
publish = true
release = true
git_release_enable = false
git_tag_enable = false
pr_branch_prefix = "release-plz/"
pr_labels = ["release"]

# メイン crate がタグと GitHub release を担当する。
[[package]]
name = "sapphire-framework-workspace"
git_tag_enable = true
git_release_enable = true
git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"
version_group = "framework"

[[package]]
name = "sapphire-framework-retrieve"
version_group = "framework"

[[package]]
name = "sapphire-framework-track"
version_group = "framework"

[[package]]
name = "sapphire-framework-rpc"
version_group = "framework"

[[package]]
name = "sapphire-framework-blob"
version_group = "framework"

[[package]]
name = "sapphire-framework-registry"
version_group = "framework"

[[package]]
name = "sapphire-framework-remote-server"
version_group = "framework"

[[package]]
name = "sapphire-framework-remote-client"
version_group = "framework"

[[package]]
name = "sapphire-framework-backend"
version_group = "framework"

# ファサードが `gui` feature で optional 参照する。ファサードを publish する
# 前提として、これ自身も publish されている必要がある。
[[package]]
name = "sapphire-framework-gui"
version_group = "framework"

# 単一依存ファサード（#95）。
[[package]]
name = "sapphire-framework"
version_group = "framework"

[changelog]
# 既存 CHANGELOG.md のヘッダーをそのまま維持し、新規エントリは
# このヘッダーの下に挿入される（既存履歴は保持される）。
header = """# Changelog

All notable changes to `sapphire-workspace` are documented here.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/).
This project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
