# Pin the toolchain so CI and local checkouts agree.
#
# CI runs `cargo clippy -- -D warnings`, so every new stable release used to
# land its new lints directly in a red CI run — and a contributor on an older
# stable could not reproduce the failure. Bump this deliberately instead, and
# fix the new lints in the same commit.
[toolchain]
channel = "1.98.0"
components = ["clippy", "rustfmt"]
