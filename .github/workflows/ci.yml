name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The toolchain (and its clippy/rustfmt components) comes from
      # rust-toolchain.toml. rustup installs it on first use; do that in its
      # own step so the download does not land in the middle of another one.
      - name: Install the pinned toolchain
        run: cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler cmake libwayland-dev libxkbcommon-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features --locked

  # Privilege separation is the one thing the job above cannot test: these tests must start
  # as root, become two other users, and prove they cannot become root again. They are
  # `#[ignore]`d everywhere else, and the two accounts they name exist only here.
  #
  # `--test-threads=1` is not a nicety: the drop is process-wide, so two of these running at
  # once would fight over the identity of the same process. That is also why each test forks
  # a child and drops there.
  #
  # `sudo -E` keeps the runner's environment (so RUSTUP_HOME still finds the pinned
  # toolchain); `env "PATH=$PATH" "CARGO_HOME=$CARGO_HOME"` spells out the two the root
  # cargo needs — plain `sudo` resets them, and a root build with its own CARGO_HOME would
  # download the whole index into /root.
  privileged:
    name: privilege separation (root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Print the toolchain
        run: cargo --version

      - name: Create the two test accounts
        run: |
          sudo useradd -m sapphire-human
          sudo useradd -m sapphire-tools

      - name: Run the privileged tests
        run: |
          sudo -E env "PATH=$PATH" "CARGO_HOME=$CARGO_HOME" \
            cargo test -p sapphire-framework-server --all-features \
            --test privilege_root -- --ignored --test-threads=1

  # The Windows named pipe carrier (crates/sapphire-framework-ipc/src/windows.rs) sits
  # behind `#[cfg(windows)]`, so the job above never compiles it. This job runs that
  # crate's tests on Windows, where the pipe, the DACL and the SID lookup are real.
  #
  # Scoped to the ipc crate on purpose. The crate's own dependency graph is portable
  # (serde, tokio, windows-sys, …), so this job needs no extra setup and its signal is
  # unambiguous. A workspace-wide Windows job is a separate, larger change: other
  # members pull in fastembed/ort and grain-id (protoc + cmake) and ring/aws-lc-sys
  # (C toolchain), so widening this job would mean solving their Windows build first.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (ipc)
        run: cargo clippy -p sapphire-framework-ipc --all-targets --all-features -- -D warnings

      - name: Test (ipc)
        run: cargo test -p sapphire-framework-ipc --all-features --locked
